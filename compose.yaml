services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: operations_automation_hub
      POSTGRES_USER: operations_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations_user -d operations_automation_hub"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
