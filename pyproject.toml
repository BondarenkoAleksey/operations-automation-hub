[project]
name = "operations-automation-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "user", email = "bonddd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0,<3",
    "sqlalchemy>=2.0,<2.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "-m", "not integration"]
markers = [
    "integration: tests that require external infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
